name: Engine tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Syntax-check the shipped static app, then run the dependency-free Node
      # regression suite. This stays independent from the IPA build.
      - name: Verify JavaScript and run tests
        run: npm run verify
