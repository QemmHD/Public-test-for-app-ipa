name: Build NutriCheck IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Public release numbers start at NutriCheck 12 for workflow run 11.
      # Every future IPA build automatically advances to 13, 14, and so on.
      - name: Set NutriCheck release number
        run: |
          RELEASE_NUMBER=$((GITHUB_RUN_NUMBER + 1))
          echo "RELEASE_NUMBER=$RELEASE_NUMBER" >> "$GITHUB_ENV"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('capacitor.config.json')); p.appName='NutriCheck ${RELEASE_NUMBER}'; fs.writeFileSync('capacitor.config.json', JSON.stringify(p, null, 2) + '\n');"
          echo "Building NutriCheck $RELEASE_NUMBER"

      - name: Install dependencies
        run: npm install

      - name: Add iOS platform
        run: |
          npx cap add ios
          npx cap sync ios

      # The barcode scanner uses the camera via getUserMedia, and the
      # "Add by photo" flow opens the camera. iOS requires a usage-description
      # string in Info.plist or the app crashes when requesting the camera.
      - name: Add camera permission to Info.plist
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'NutriCheck uses the camera to scan barcodes and read ingredient labels.'" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'NutriCheck uses the camera to scan barcodes and read ingredient labels.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'NutriCheck can read ingredient labels from your photos.'" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'NutriCheck can read ingredient labels from your photos.'" "$PLIST"
          echo "== Info.plist camera keys ==" && /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$PLIST"

      # Stamp the real app version into the freshly-generated iOS project.
      # `cap add ios` recreates the project each build, so without this the
      # sideloaded IPA always reports Capacitor's default 1.0. Marketing
      # version comes from package.json; the build number is the CI run.
      - name: Set app version
        run: |
          PLIST=ios/App/App/Info.plist
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $APP_VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${{ github.run_number }}" "$PLIST"
          echo "== App version ==" && /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST"

      # Lock the app to right-side-up portrait so it never rotates sideways.
      # Replace any existing supported-orientations arrays with portrait-only, and
      # require full screen so iPad can't override the lock via multitasking.
      - name: Lock orientation to portrait
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationPortrait" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :UIRequiresFullScreen true" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "$PLIST"
          echo "== Orientation ==" && /usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations" "$PLIST"

      # Generate and verify the custom NutriCheck icon. Icon generation is
      # required so an IPA can never silently ship with Capacitor's default.
      - name: Generate app icon
        run: |
          npx --yes @capacitor/assets@3 generate --ios --assetPath assets
          APPICON=ios/App/App/Assets.xcassets/AppIcon.appiconset
          test -d "$APPICON"
          ICON_COUNT=$(find "$APPICON" -type f -name '*.png' | wc -l | tr -d ' ')
          echo "Generated $ICON_COUNT iOS app-icon images"
          test "$ICON_COUNT" -ge 1

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install

      # Build for a real device (iphoneos / arm64), UNSIGNED.
      # iOSGods (and other signing services / Sideloadly) strip the signature
      # and re-sign with their own certificate, so we must NOT ship a simulator
      # build here — a simulator binary cannot install on a physical iPhone.
      - name: Build unsigned device IPA
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="${{ env.APP_VERSION }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build

      - name: Package IPA
        run: |
          cd ios/App
          APP_PATH="build/Build/Products/Release-iphoneos/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Expected device build at $APP_PATH was not found"
            ls -R build/Build/Products || true
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          # Sanity check: confirm the binary is an arm64 device Mach-O.
          echo "== Mach-O architecture =="
          lipo -info "Payload/App.app/App" || file "Payload/App.app/App"
          zip -qr "NutriCheck-${RELEASE_NUMBER}.ipa" Payload
          mv "NutriCheck-${RELEASE_NUMBER}.ipa" "../../NutriCheck-${RELEASE_NUMBER}.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutriCheck-${{ env.RELEASE_NUMBER }}-IPA
          path: NutriCheck-${{ env.RELEASE_NUMBER }}.ipa
          retention-days: 90

      # Publish the IPA as a GitHub Release asset so there is a direct,
      # one-click download link for the file to upload into the iOSGods signer.
      - name: Publish IPA to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nutricheck-${{ env.RELEASE_NUMBER }}
          name: NutriCheck ${{ env.RELEASE_NUMBER }}
          body: |
            NutriCheck **${{ env.RELEASE_NUMBER }}** (v${{ env.APP_VERSION }}) unsigned device (arm64) IPA for sideloading.

            Download `NutriCheck-${{ env.RELEASE_NUMBER }}.ipa` below and upload it to the iOSGods
            signer (App+ / VIP online sign, or Sideloadly). They re-sign it
            with their certificate; this build is intentionally unsigned.
          files: NutriCheck-${{ env.RELEASE_NUMBER }}.ipa
