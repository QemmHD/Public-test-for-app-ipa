name: Build LaunchTest IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Add iOS platform
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install

      # Build for a real device (iphoneos / arm64), UNSIGNED.
      # iOSGods (and other signing services / Sideloadly) strip the signature
      # and re-sign with their own certificate, so we must NOT ship a simulator
      # build here — a simulator binary cannot install on a physical iPhone.
      - name: Build unsigned device IPA
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package IPA
        run: |
          cd ios/App
          APP_PATH="build/Build/Products/Release-iphoneos/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Expected device build at $APP_PATH was not found"
            ls -R build/Build/Products || true
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          # Sanity check: confirm the binary is an arm64 device Mach-O.
          echo "== Mach-O architecture =="
          lipo -info "Payload/App.app/App" || file "Payload/App.app/App"
          zip -qr LaunchTest.ipa Payload
          mv LaunchTest.ipa ../../LaunchTest.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaunchTest-IPA
          path: LaunchTest.ipa
          retention-days: 90

      # Publish the IPA as a GitHub Release asset so there is a direct,
      # one-click download link for the file to upload into the iOSGods signer.
      - name: Publish IPA to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LaunchTest build ${{ github.run_number }}
          body: |
            Unsigned **device (arm64)** IPA for sideloading.

            Download `LaunchTest.ipa` below and upload it to the iOSGods
            signer (App+ / VIP online sign, or Sideloadly). They re-sign it
            with their certificate; this build is intentionally unsigned.
          files: LaunchTest.ipa
