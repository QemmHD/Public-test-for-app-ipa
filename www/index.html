<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>LaunchTest</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #0a0a0f;
      color: #f5f5f7;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      text-align: center;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(64,120,255,0.25), transparent 60%),
        radial-gradient(900px 500px at 50% 110%, rgba(120,64,255,0.18), transparent 60%),
        #0a0a0f;
    }
    .badge {
      width: 96px; height: 96px;
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      font-size: 48px;
      background: linear-gradient(145deg, #2f6bff, #6a3cff);
      box-shadow: 0 18px 50px rgba(80,90,255,0.45);
      margin-bottom: 24px;
      animation: pop 0.6s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
    .status {
      margin-top: 10px;
      font-size: 15px;
      color: #7CFFA6;
      font-weight: 600;
    }
    .card {
      margin-top: 28px;
      width: 100%;
      max-width: 360px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 18px;
      padding: 6px 0;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 13px 18px;
      font-size: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .row:last-child { border-bottom: none; }
    .row .k { color: #9a9aa5; }
    .row .v { color: #f5f5f7; font-weight: 600; font-variant-numeric: tabular-nums; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    button {
      margin-top: 26px;
      border: none;
      border-radius: 14px;
      padding: 16px 30px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(145deg, #2f6bff, #6a3cff);
      box-shadow: 0 10px 30px rgba(80,90,255,0.4);
      transition: transform 0.08s ease;
    }
    button:active { transform: scale(0.96); }
    .tap {
      margin-top: 14px;
      font-size: 14px;
      color: #9a9aa5;
      min-height: 18px;
    }
    .foot { margin-top: 30px; font-size: 12px; color: #5a5a66; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="badge">🚀</div>
  <h1>LaunchTest</h1>
  <div class="status">✓ App launched successfully</div>

  <div class="card">
    <div class="row"><span class="k">Build</span><span class="v" id="build">v1.0.0</span></div>
    <div class="row"><span class="k">Launched at</span><span class="v" id="time">—</span></div>
    <div class="row"><span class="k">Screen</span><span class="v" id="screen">—</span></div>
    <div class="row"><span class="k">Platform</span><span class="v" id="platform">—</span></div>
    <div class="row"><span class="k">Touch</span><span class="v" id="touch">—</span></div>
  </div>

  <button id="btn">Tap to confirm interactivity</button>
  <div class="tap" id="taps"></div>

  <div class="foot">If you can read this on your device,<br />signing &amp; launch worked.</div>

  <script>
    var taps = 0;
    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    document.getElementById('time').textContent =
      (function () { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); })();

    document.getElementById('screen').textContent =
      Math.round(window.screen.width) + '×' + Math.round(window.screen.height) +
      ' @' + (window.devicePixelRatio || 1) + 'x';

    document.getElementById('platform').textContent = navigator.platform || 'iOS';

    document.getElementById('touch').textContent =
      ('ontouchstart' in window || navigator.maxTouchPoints > 0) ? 'Yes' : 'No';

    document.getElementById('btn').addEventListener('click', function () {
      taps++;
      document.getElementById('taps').textContent =
        taps === 1 ? 'It works! 1 tap registered' : taps + ' taps registered';
      if (navigator.vibrate) navigator.vibrate(8);
    });
  </script>
</body>
</html>
